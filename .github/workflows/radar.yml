name: notice-radar

# 这个工作流现在只保留**手动触发**，定时交给本机任务（scripts/install-boot-task.ps1）。
#
# 为什么停掉云端定时：
#   1. GitHub 的 schedule 不准点，本仓库实测整体晚 6~8 小时，设 01/04/07 UTC 实际落在
#      北京时间下午三点、晚上八点、半夜；
#   2. 更要紧的是，从 GitHub 的机器（Azure）到川大校园网经常连 TCP 握手都超时，
#      实测站点抓取成功率只有 ~20%，而本机是 100%；
#   3. 本机任务和云端各有一份 state/state.json，两边同时跑会把同一条通告推两遍。
#
# 想恢复云端定时：把下面 schedule 两行取消注释即可（但请先停掉本机任务，
# 否则同一条通告会重复推送）。
on:
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch: # 网页上手动点一下：settings → Actions → notice-radar → Run workflow
    inputs:
      mode:
        description: '运行模式：run=正常抓取；test-email=只发一封测试邮件（不抓取、不改状态）'
        type: choice
        options:
          - run
          - test-email
        default: run

permissions:
  contents: write # 需要把 state/ 提交回仓库，才能记住哪些通告已经推过

# 避免两次定时任务同时跑，导致 state 冲突
concurrency:
  group: notice-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查 Secrets 是否齐全
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 Secret：$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "### ❌ 缺少 Secrets"
              echo ""
              echo '在 **Settings → Secrets and variables → Actions** 里补齐：`SMTP_HOST` `SMTP_PORT` `SMTP_USER` `SMTP_PASS` `MAIL_TO`'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 只发一封测试邮件（手工触发时选 test-email）
        if: github.event.inputs.mode == 'test-email'
        run: node src/cli.js send-test
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 检查通告并发送邮件
        id: radar
        if: github.event.inputs.mode != 'test-email'
        continue-on-error: true
        run: node src/cli.js run --strict
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # 失败重试现在在抓取层内部做（10s 超时 × 5 次尝试 + 指数退避），
      # 原来那个「等两分钟再跑一遍」的步骤在实测中从未生效，删掉。
      # 汇总文件放 Artifacts，不提交进仓库：避免和本地冲突，也避免仓库膨胀
      - name: 上传 Markdown 汇总
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-radar-digest
          path: out/
          if-no-files-found: ignore
          retention-days: 30

      - name: 提交去重状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state)" ]; then
            echo "状态没有变化，跳过提交"
            exit 0
          fi
          git add state
          git commit -m "chore: 更新通告去重状态 [skip ci]"
          git push
