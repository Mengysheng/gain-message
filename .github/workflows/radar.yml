name: notice-radar

# GitHub 的 cron 用 UTC。北京时间 = UTC+8
#   00:00 UTC = 08:00 北京
#   04:00 UTC = 12:00 北京
#   11:00 UTC = 19:00 北京
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch: # 也可以在网页上手动点一下立即运行
    inputs:
      mode:
        description: '运行模式：run=正常抓取；test-email=只发一封测试邮件（不抓取、不改状态）'
        type: choice
        options:
          - run
          - test-email
        default: run

permissions:
  contents: write # 需要把 state/ 提交回仓库，才能记住哪些通告已经推过

# 避免两次定时任务同时跑，导致 state 冲突
concurrency:
  group: notice-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查 Secrets 是否齐全
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 Secret：$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "### ❌ 缺少 Secrets"
              echo ""
              echo '在 **Settings → Secrets and variables → Actions** 里补齐：`SMTP_HOST` `SMTP_PORT` `SMTP_USER` `SMTP_PASS` `MAIL_TO`'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 只发一封测试邮件（手工触发时选 test-email）
        if: github.event.inputs.mode == 'test-email'
        run: node src/cli.js send-test
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 检查通告并发送邮件
        id: radar
        if: github.event.inputs.mode != 'test-email'
        continue-on-error: true
        run: node src/cli.js run --strict
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # 云端到国内站点的跨境链路偶尔会抖一下（表现为 fetch failed），
      # 隔两分钟再试通常就好了。已经推送过的条目不会重复推。
      - name: 失败后等两分钟重试一次
        if: github.event.inputs.mode != 'test-email' && steps.radar.outcome == 'failure'
        run: |
          echo "上一次运行失败，2 分钟后重试（跨境链路抖动通常能自愈）"
          {
            echo "### ⏳ 第一次运行失败，2 分钟后自动重试"
            echo ""
            echo "如果重试仍失败，看下面这一次的 Job Summary。"
          } >> "$GITHUB_STEP_SUMMARY"
          sleep 120
          node src/cli.js run --strict
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 提交去重状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state out)" ]; then
            echo "状态没有变化，跳过提交"
            exit 0
          fi
          git add -A
          git commit -m "chore: 更新通告去重状态 [skip ci]"
          git push
