name: notice-radar

# GitHub 的 cron 用 UTC。北京时间 = UTC+8
#
# 为什么要跑这么勤：GitHub 的 schedule 触发并不准点（本仓库实测整体晚 6~8 小时），
# 想「只在白天 9/12/15 点跑」是做不到的——设 01/04/07 UTC，实际会落到北京时间
# 下午三点、晚上八点、半夜。与其猜时间，不如每两小时跑一次，靠次数换成功率。
#
# 多跑不会多推：去重状态记着哪些通告已经发过，重复运行只会刷新 lastSeen。
# 每 20 小时最多一封心跳，不用担心收件箱被刷屏。
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: # 也可以在网页上手动点一下立即运行
    inputs:
      mode:
        description: '运行模式：run=正常抓取；test-email=只发一封测试邮件（不抓取、不改状态）'
        type: choice
        options:
          - run
          - test-email
        default: run

permissions:
  contents: write # 需要把 state/ 提交回仓库，才能记住哪些通告已经推过

# 避免两次定时任务同时跑，导致 state 冲突
concurrency:
  group: notice-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查 Secrets 是否齐全
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 Secret：$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "### ❌ 缺少 Secrets"
              echo ""
              echo '在 **Settings → Secrets and variables → Actions** 里补齐：`SMTP_HOST` `SMTP_PORT` `SMTP_USER` `SMTP_PASS` `MAIL_TO`'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 只发一封测试邮件（手工触发时选 test-email）
        if: github.event.inputs.mode == 'test-email'
        run: node src/cli.js send-test
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 检查通告并发送邮件
        id: radar
        if: github.event.inputs.mode != 'test-email'
        continue-on-error: true
        run: node src/cli.js run --strict
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # 失败重试现在在抓取层内部做（10s 超时 × 5 次尝试 + 指数退避），
      # 原来那个「等两分钟再跑一遍」的步骤在实测中从未生效，删掉。
      # 汇总文件放 Artifacts，不提交进仓库：避免和本地冲突，也避免仓库膨胀
      - name: 上传 Markdown 汇总
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-radar-digest
          path: out/
          if-no-files-found: ignore
          retention-days: 30

      - name: 提交去重状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state)" ]; then
            echo "状态没有变化，跳过提交"
            exit 0
          fi
          git add state
          git commit -m "chore: 更新通告去重状态 [skip ci]"
          git push
