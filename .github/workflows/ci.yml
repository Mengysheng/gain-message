name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 语法检查
        run: |
          for file in src/*.js test/*.js; do
            node --check "$file"
          done

      - name: 离线 smoke test（demo 全链路）
        run: |
          node src/cli.js demo --out /tmp/demo.html
          test -s /tmp/demo.html
          grep -q "通告雷达" /tmp/demo.html
