# ============================================================
# 通告雷达 配置文件（四川大学版）
# 改完先跑 `node src/cli.js test` 看解析对不对，再跑 run
# ============================================================

timezone: Asia/Shanghai
state_file: state/state.json
retention_days: 120

request:
  # 单次请求超时。GitHub Actions 到川大校园网的表现是「TCP 握手就超时」，
  # 20s 只会让三个站点串起来白等五分钟，所以缩到 10s、用次数换成功率。
  timeout: 10000
  retries: 4          # 失败重试次数（1.5s / 6s / 13.5s / 24s 退避 + 随机抖动）
  concurrency: 3      # 抓详情页时的并发
  site_concurrency: 3 # 站点之间并行，别排队

# ------------------------------------------------------------
# 关键词：交换 / 实习
#   普通词是子串匹配：`交换` 能匹配「交换生」「校际交换」
#   如果你的目标包含「交流项目」，建议再加上 交流、选派、访学（见注释）
# ------------------------------------------------------------
keywords:
  include:
    - 交换
    - 实习
    # 教务处的交换项目基本都写作「关于选派本科生参加…项目」
    # 只搜「交换」会漏掉，所以补一个「选派」；不需要可以删掉
    - 选派
    # 竞赛类：单字「赛」能覆盖 比赛/竞赛/大赛/决赛/赛事，
    # 但也会命中「赛程」「赛季」这类与报名无关的标题，嫌吵就换成 竞赛 + 大赛
    - 赛
    # 大创 = 大学生创新创业训练计划（立项/结题/中期检查/国创）
    - 大创
    # - 交流
    # - 访学
  exclude:
    - 招标
    - 中标
    # 子串匹配的经典误伤：「贯彻落实习近平…」里藏着「实习」两个字，
    # 会让政治学习类通知被当成实习机会推过来。排除掉这类标题。
    - 习近平
    - 总书记
  include_mode: any
  match_in: title

sites:
  # 1) 教务处 · 通知公告
  - name: 川大教务处·通知公告
    url: https://jwc.scu.edu.cn/ssjgy.jsp?wbtreeid=1001
    list:
      item: "div.list li"
      title: "a"
      link: "a"
      date: "span"
    detail:
      enabled: false       # 教务处详情页是静态的，想带摘要改成 true 并填 content 选择器

  # 2) 就业网 · 实习岗位（只含实习，不含全职）
  - name: 川大就业网·实习岗位
    url: https://jy.scu.edu.cn/index/index/employjob.html?type=2
    # 这个站点会拦截 GitHub Actions 的机房 IP（本地能抓、Actions 报 403）
    # 部署 Cloudflare Worker 后取消下面这行注释，见 docs/proxy.md
    # proxy: "https://notice-proxy.xxx.workers.dev/?url={url}"
    list:
      item: "div#mycontent li"
      title: "a"
      link: "a"
      date: "span.list1_time"
    detail:
      enabled: false

  # 3) 就业网 · 通知公告（选调生、招聘会、就业政策等）
  - name: 川大就业网·通知公告
    url: https://jy.scu.edu.cn/index/index/newslist.html?data=MQ
    # proxy: "https://notice-proxy.xxx.workers.dev/?url={url}"
    list:
      item: "div#mycontent li"
      title: "a"
      link: "a"
      date: "span.list1_time"
    detail:
      enabled: false

# 首次订阅每个站点时，附最近若干条做样例，确认解析正确
first_run:
  mode: digest
  limit: 5

# ------------------------------------------------------------
# 邮件：密码用环境变量，不要写在这里
#   SMTP_HOST / SMTP_PORT / SMTP_SECURE / SMTP_USER / SMTP_PASS / MAIL_TO
# ------------------------------------------------------------
email:
  enabled: true
  to:
    - your-name@qq.com
  from_name: 通告雷达
  subject_prefix: "[通告雷达]"
  mode: digest
  send_on_error: true

  # 告警降噪：以前只要有一个站点超时就发信，收件箱里几乎全是「抓取失败」。
  # 现在同一个站点连续失败 3 次才发告警，偶发抖动只写在日志和 Job Summary 里。
  error_alerts:
    enabled: true
    after_consecutive_failures: 3

  # 心跳：超过 20 小时没发过任何邮件，就发一封「我还活着」+ 三个站点的状态。
  # 这样「今天真的没新通告」和「脚本已经挂了一周」在收件箱里能区分开。
  heartbeat:
    enabled: true
    min_interval_hours: 20

  smtp:
    host: smtp.qq.com
    port: 465
    secure: true
    user: your-name@qq.com
    pass: ""

export:
  enabled: true
  dir: out
  history: true
